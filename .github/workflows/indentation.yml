name: Indent

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: dealii/dealii:v9.7.1-noble
      options: --user root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: 0

      - name: Mark the repository as safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Format indentation
        run: ./scripts/indent

      - name: Commit indentation fix
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref != 'master'
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.cc' '*.h'
          git commit -m "Indent."
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Verify indentation
        run: git diff-files --quiet
